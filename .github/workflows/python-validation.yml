name: Repository Validation

on:
  push:
  pull_request:

jobs:
  validate:
    name: Static analytical quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Protect validated analytical core
        run: python scripts/validate_repository.py

      - name: Validate public synthetic sample
        run: python python/validate_portfolio.py

      - name: Run clone-safe tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m py_compile python/validate_portfolio.py python/category_eda.py scripts/validate_repository.py tests/test_portfolio_data.py
